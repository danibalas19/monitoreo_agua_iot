# PlatformIO Configuration
# Monitoreo Agua IoT - ESP32 Firmware

[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_port = COM3

# Librerías de ESP32
lib_deps =
    # WiFi & Networking
    WiFi
    # MQTT
    knolleary/PubSubClient@^2.8
    # HTTP Client
    adafruit/Adafruit GFX Library@^1.11
    # JSON
    bblanchon/ArduinoJson@^6.21
    # Sensors
    DFRobot_PH@^1.0
    DFRobot_EC@^1.2
    OneWire
    DallasTemperature
    # Storage
    LittleFS
    # Utilities
    Time

# Build options
build_flags =
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    -DLOG_LOCAL_LEVEL=ESP_LOG_DEBUG

# Monitor & Upload settings
upload_speed = 921600
upload_port = COM3

# Output folder
build_dir = .pio/build
lib_dir = lib
src_dir = src
